<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuizzApp Secure Client</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { color: #333; margin-top: 25px; }
        .panel { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .form-group label { display: block; margin-top: 10px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #218838; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .info { color: darkorange; }
        .hidden { display: none; }
        .quiz-option-label { display: block; margin: 8px 0; cursor: pointer; }
    </style>
</head>
<body onload="checkAuthStatus()">

    <div class="container">
        <h1>MyQuizzApp: Full Secure Client</h1>
        <div id="status"></div>
        <div id="userInfo" class="info"></div>
        <hr>

        <div id="authPanel" class="panel">
            <h2>1. User Authentication</h2>
            <div class="form-group">
                <label for="authUsername">Username:</label>
                <input type="text" id="authUsername" value="admin">
            </div>
            <div class="form-group">
                <label for="authPassword">Password:</label>
                <input type="password" id="authPassword" value="adminpass">
            </div>
            <button onclick="loginUser()">Login</button>
            <button onclick="signupUser()" style="background-color: #007bff;">Sign Up (Role: USER)</button>
            <button onclick="logoutUser()" style="background-color: #dc3545;" class="hidden" id="logoutButton">Logout</button>
        </div>

        <div id="adminPanel" class="panel hidden">
            <h2>2. Create New Dynamic Quiz (Requires ADMIN Role)</h2>
            <form id="createQuizForm">
                <div class="form-group">
                    <label for="title">Quiz Title:</label>
                    <input type="text" id="title" required value="New Generated Quiz">
                </div>
                <div class="form-group">
                    <label for="topicId">Topic:</label>
                    <select id="topicId" required>
                        <option value="">Loading Topics...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="difficultyLevel">Difficulty:</label>
                    <select id="difficultyLevel" required>
                        <option value="EASY">EASY</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HARD">HARD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="questionCount">Question Count:</label>
                    <input type="number" id="questionCount" min="1" max="100" required value="3">
                </div>
                <button type="button" onclick="createQuiz()">Create Quiz</button>
            </form>
        </div>
        
        <hr>

        <div class="panel">
            <h2>3. Load and Submit Quiz</h2>
             <label for="quizIdInput">Enter Quiz ID to Load:</label>
             <input type="number" id="quizIdInput" value="1" placeholder="e.g., 1">
             <button onclick="loadQuiz()">Load Quiz (Public)</button>
        </div>


        <div id="quizDisplay" class="quiz-container hidden">
            <h3 id="quizTitle"></h3>
            <p id="quizDescription"></p>
            <form id="quizForm"></form>
            <button onclick="submitQuiz()">Submit Quiz (Requires Login)</button>
        </div>

        <div id="resultsDisplay" class="results-container hidden">
            <h3>Quiz Results</h3>
            <p>Total Questions: <span id="totalQs"></span></p>
            <p class="success">Correct Score: <span id="correctScore"></span></p>
            <p>Percentage: <span id="percentage"></span>%</p>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080/api';
        let currentQuizId = null;
        let JWT = localStorage.getItem('jwtToken');
        let USER_ROLES = [];
        let USERNAME = null;
        // The password for the manually seeded Admin user (if created): "adminpass"

        // --- UTILITY FUNCTIONS ---

        function getAuthHeader() {
            return {
                'Content-Type': 'application/json',
                // Sends token for secured endpoints
                'Authorization': JWT ? `Bearer ${JWT}` : '' 
            };
        }

        function logStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<p class="${type}">${message}</p>`;
        }

        // Checks local storage and updates UI to show login status
        function checkAuthStatus() {
            const token = localStorage.getItem('jwtToken');
            const roles = localStorage.getItem('userRoles');
            const username = localStorage.getItem('username');

            if (token && roles) {
                JWT = token;
                USER_ROLES = JSON.parse(roles);
                USERNAME = username;
                
                document.getElementById('userInfo').innerHTML = `
                    Logged in as: <strong>${USERNAME}</strong> | Roles: <strong>${USER_ROLES.join(', ')}</strong>
                `;
                document.getElementById('logoutButton').classList.remove('hidden');
                
                // Show Admin Panel and fetch topics if user is ADMIN
                if (USER_ROLES.includes('ROLE_ADMIN')) {
                    document.getElementById('adminPanel').classList.remove('hidden');
                    fetchTopics(); 
                } else {
                    document.getElementById('adminPanel').classList.add('hidden');
                }
            } else {
                JWT = null;
                USER_ROLES = [];
                document.getElementById('userInfo').textContent = 'Status: Logged Out';
                document.getElementById('logoutButton').classList.add('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
        }

        // --- AUTHENTICATION ENDPOINTS ---

        async function handleAuthResponse(url, body) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await response.json();
                return { response, data };
            } catch (error) {
                logStatus(`Connection Error: Is the backend running at ${BASE_URL}? ${error.message}`, 'error');
                return { response: { ok: false, status: 500 }, data: { message: 'Network error' } };
            }
        }
        
        async function signupUser() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            
            const { response, data } = await handleAuthResponse(`${BASE_URL}/auth/signup`, { username, password });
            
            if (response.ok) {
                logStatus(`✅ SUCCESS: User ${username} registered with ROLE_USER. You can now log in.`, 'success');
            } else if (response.status === 409) {
                 logStatus(`Signup Failed: Username ${username} already taken.`, 'error');
            } else {
                 logStatus(`Signup Failed: ${data.message || JSON.stringify(data)}`, 'error');
            }
        }

        async function loginUser() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;

            const { response, data } = await handleAuthResponse(`${BASE_URL}/auth/login`, { username, password });

            if (response.ok) {
                // Store JWT and roles
                localStorage.setItem('jwtToken', data.accessToken);
                localStorage.setItem('userRoles', JSON.stringify(data.roles));
                localStorage.setItem('username', data.username);
                
                logStatus(`✅ Login successful! Welcome ${data.username}.`, 'success');
                checkAuthStatus(); // Update UI

            } else {
                logStatus(`Login Failed. Status: ${response.status}. Check credentials.`, 'error');
            }
        }

        function logoutUser() {
            localStorage.clear();
            logStatus('Logged out successfully.', 'info');
            checkAuthStatus(); // Update UI
        }
        
        // --- ADMIN FUNCTIONS (Secured by JWT) ---

        // Fetches topics (Requires Authentication to access /api/topics)
        async function fetchTopics() {
            const token = localStorage.getItem('jwtToken');
            if (!token) return;

            try {
                const response = await fetch(`${BASE_URL}/topics`, {
                    headers: getAuthHeader() 
                });
                
                const selectElement = document.getElementById('topicId');
                selectElement.innerHTML = ''; 
                
                if (response.status === 403) {
                     selectElement.innerHTML = '<option value="">Access Denied (Not ADMIN)</option>';
                     logStatus("Error: Topic fetch failed (403). Only ADMINs can access /api/topics.", 'error');
                     return;
                }
                if (!response.ok) throw new Error(`Status: ${response.status}`);

                const topics = await response.json();
                
                if (topics.length === 0) {
                     selectElement.innerHTML = '<option value="">No Topics Found</option>';
                     return;
                }

                topics.forEach(topic => {
                    const option = document.createElement('option');
                    option.value = topic.id;
                    option.textContent = `${topic.name} (ID: ${topic.id})`;
                    selectElement.appendChild(option);
                });
                
            } catch (error) {
                logStatus(`Error connecting to Topic API: ${error.message}.`, 'error');
            }
        }
        
        // POST /api/quizzes (Requires ROLE_ADMIN)
        async function createQuiz() {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                 logStatus("Creation Failed: You must be logged in.", 'error');
                 return;
            }
            if (!USER_ROLES.includes('ROLE_ADMIN')) {
                 logStatus("Creation Failed: You need ROLE_ADMIN authorization.", 'error');
                 return;
            }

            const quizRequest = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                topicIdDTO: { id: parseInt(document.getElementById('topicId').value) },
                difficultyLevel: document.getElementById('difficultyLevel').value,
                questionCount: parseInt(document.getElementById('questionCount').value)
            };

            try {
                logStatus("Creating secured quiz...");
                const response = await fetch(`${BASE_URL}/quizzes`, {
                    method: 'POST',
                    headers: getAuthHeader(), 
                    body: JSON.stringify(quizRequest),
                });
                
                const responseData = await response.json();
                
                if (response.status === 201) {
                    const newQuizId = responseData.id;
                    logStatus(`✅ Quiz created successfully! New ID: ${newQuizId}. (Admin view)`, 'success');
                    document.getElementById('quizIdInput').value = newQuizId;

                } else if (response.status === 403) {
                     logStatus("Creation Failed: 403 Forbidden. Role not authorized.", 'error');
                } else if (response.status === 400 || response.status === 409) {
                    logStatus(`Creation Error: ${responseData.message || JSON.stringify(responseData)}`, 'error');
                } else {
                    logStatus(`Creation Error. HTTP Status: ${response.status}`, 'error');
                }

            } catch (error) {
                logStatus(`Creation Error: ${error.message}.`, 'error');
            }
        }
        
        // --- USER/TAKER FUNCTIONS ---
        
        // GET /api/quizzes/{id} (Public endpoint)
        async function loadQuiz() {
            const quizId = document.getElementById('quizIdInput').value;
            // ... (Quiz ID validation and public fetch logic) ...
            
            // Simplified fetch logic for public endpoint
            try {
                logStatus(`Loading quiz ID ${quizId}...`);
                const response = await fetch(`${BASE_URL}/quizzes/${quizId}`);

                if (response.status === 404) {
                    logStatus(`Error: Quiz ID ${quizId} not found (404).`, 'error');
                    document.getElementById('quizDisplay').classList.add('hidden');
                    return;
                }
                
                const quizData = await response.json();
                
                currentQuizId = quizData.id;
                renderQuiz(quizData);
                logStatus(`Successfully loaded Quiz ID ${quizId}. (Public Secure View)`);

            } catch (error) {
                logStatus(`Fetch Error: ${error.message}`, 'error');
                document.getElementById('quizDisplay').classList.add('hidden');
            }
        }

        // POST /api/quizzes/submit (Requires Authentication - ROLE_USER/ADMIN is fine)
        async function submitQuiz() {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                 logStatus("Submission Failed: You must be logged in to submit a quiz and track your score.", 'error');
                 return;
            }
            
            const formData = new FormData(quizForm);
            const submissionData = { quizId: currentQuizId, answers: [] };
            
            // ... (Answer collection and validation logic) ...
            
            try {
                logStatus("Submitting quiz for scoring...");
                
                const response = await fetch(`${BASE_URL}/quizzes/submit`, {
                    method: 'POST',
                    headers: getAuthHeader(), // Send JWT
                    body: JSON.stringify(submissionData),
                });

                if (response.status === 401) {
                     logStatus("Submission Failed: 401 Unauthorized. Your token may be expired or invalid.", 'error');
                     return;
                }
                if (!response.ok) throw new Error(`Submission failed! status: ${response.status}`);
                
                const results = await response.json();
                renderResults(results);
                logStatus("Quiz submitted successfully. Results displayed.", 'success');

            } catch (error) {
                logStatus(`Submission Error: ${error.message}.`, 'error');
            }
        }
        
        function renderQuiz(quizData) {
            // ... (HTML rendering logic remains the same) ...
            document.getElementById('quizTitle').textContent = `Quiz #${quizData.id}: ${quizData.title}`;
            document.getElementById('quizDescription').textContent = quizData.description;
            quizForm.innerHTML = '';
            document.getElementById('resultsDisplay').classList.add('hidden');
            document.getElementById('quizDisplay').classList.remove('hidden');

            quizData.questions.forEach((q, qIndex) => {
                const optionsList = q.options || q.userOptions; 
                
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `<strong>Q${qIndex + 1}: ${q.text}</strong>`;

                optionsList.forEach((o) => {
                    const optionLabel = document.createElement('label');
                    optionLabel.className = 'quiz-option-label';
                    optionLabel.innerHTML = `<input type="radio" name="q-${q.id}" value="${o.id}" required>${o.text}`;
                    questionDiv.appendChild(optionLabel);
                });
                quizForm.appendChild(questionDiv);
            });
        }
        
        function renderResults(results) {
            // ... (HTML rendering logic remains the same) ...
            document.getElementById('totalQs').textContent = results.totalQuestions;
            document.getElementById('correctScore').textContent = results.score;
            document.getElementById('percentage').textContent = results.percentage.toFixed(2);
            
            document.getElementById('resultsDisplay').classList.remove('hidden');
            document.getElementById('quizDisplay').classList.add('hidden');
        }
    </script>

</body>
</html>
